<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Multaichat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='8' height='20' rx='2' fill='%236366f1'/%3E%3Crect x='12' y='6' width='8' height='20' rx='2' fill='%2310b981'/%3E%3Crect x='22' y='6' width='8' height='20' rx='2' fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header id="topbar"></header>
  <div id="layout">
    <aside id="sidebar" aria-label="Conversations"></aside>
    <div id="scrim" onclick="document.body.classList.remove('side-open')"></div>
    <main id="chat" aria-live="off"></main>
  </div>
  <footer id="composer"></footer>

  <dialog id="settings-dialog" aria-label="Settings"></dialog>
  <dialog id="picker-dialog" aria-label="Choose models"></dialog>
  <dialog id="batch-dialog" aria-label="Answer clarifying questions"></dialog>
  <dialog id="presets-dialog" aria-label="Presets"></dialog>
  <dialog id="preset-save-dialog" aria-label="Save preset"></dialog>
  <dialog id="sysprompt-dialog" aria-label="System prompt"></dialog>
  <dialog id="attach-dialog" aria-label="Attachment check"></dialog>

  <!-- Classic scripts (no modules) so the app also works when opened from disk. -->
  <script src="js/core/util.js?v=3"></script>
  <script src="js/core/storage.js?v=3"></script>
  <script src="js/core/openrouter.js?v=3"></script>
  <script src="js/core/models.js?v=3"></script>
  <script src="js/core/conversation.js?v=3"></script>
  <script src="js/core/cost.js?v=3"></script>
  <script src="js/core/clarify.js?v=3"></script>
  <script src="js/core/fusion.js?v=3"></script>
  <script src="js/core/presets.js?v=3"></script>
  <script src="js/core/attach.js?v=3"></script>
  <script src="js/core/router.js?v=3"></script>
  <script src="js/core/runner.js?v=3"></script>
  <script src="js/ui/markdown.js?v=3"></script>
  <script src="js/ui/dom.js?v=3"></script>
  <script src="js/ui/settings.js?v=3"></script>
  <script src="js/ui/sidebar.js?v=3"></script>
  <script src="js/ui/picker.js?v=3"></script>
  <script src="js/ui/chat.js?v=3"></script>
  <script src="js/ui/files.js?v=3"></script>
  <script src="js/ui/composer.js?v=3"></script>
  <script src="js/ui/derived.js?v=3"></script>
  <script src="js/ui/presets.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
